[default]
; Add global app-hints here

; Only affects nohw builds.
; Removes delay in starting an app for gem5 when testing driver issues (and not caring about pdump)
PDumpAppConnectWaitMS=0

# b/421977299
# b/402700686
# Disable packed RGB8 as it breaks breaks rendering into RGBX AHBs causing page faults and Greyscale rendering
EnablePackedRGB8=0

# b/423292052
# Workaround for an application issue causing FBM-related page faults
[ch.admin.meteoswiss]
DisableFBCDC=1

# b/378632977
# Workaround an application issue regarding F16 arithmetic overflow resulting in on screen
# corruption
[com.netflix.NGP.TransformersForgedToFight]
USC2F16OverflowToMax=1

# b/405110036
# Workaround an application issue regarding F16 arithmetic overflow resulting in an overly
# bright light source
[com.android1939.kards]
USC2F16OverflowToMax=1

# b/403436492
# Workaround a GPU compiler issue resulting in on screen corruption and GPU instability
[com.ubisoft.invincible.guardians.globe.idle.superhero.rpg.battle.afk]
ShaderRecompileEnable=0

# b/408058979
# Workaround an application issue where highp data is being used in mediump calculations
# resulting in on screen corruption
[jp.konami.pesam]
USC2F16OverflowToMax=1

# b/414571455
# Workaround a GPU compiler issue regarding F16 arithmetic resulting in on screen corruption
[com.jagex.runescape.android]
ForceFragmentShaderHighp=all

# b/417927115
[com.futuremark.dmandroid.application]
# Work around a bug in 3DMark Steel Nomad which uses texel buffer views with
# 128k texels, exceeding the `maxTexelBufferElements` limit of 64k texels. With
# this disabled, the driver implements texel buffer views using HW 2D textures
# instead of the HW texel buffer support.
UseTexelBufferLookup=0
# Work around a bug in 3DMark Steel Nomad where NaN propagation results in entirely
# black frames during tone mapping
USC2F16OverflowToMax=1

# b/423623611
# Enable CL GL interop for specific applications
[com.zhiliaoapp.musically]
EnableClGLInterop=1

; The parser wants name=value lines to end in a LF character, even at EOF.
; Leave this comment at the end of the file to avoid violating that.
